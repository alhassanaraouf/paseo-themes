name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - "packages/*/package.json"
  workflow_dispatch:
    inputs:
      since:
        description: "Git ref to diff against (defaults to the previous commit)"
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test

      - name: Find packages with a changed package.json
        id: changed
        run: |
          before="${{ github.event.inputs.since || github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          dirs=$(git diff --name-only "$before" "${{ github.sha }}" -- 'packages/*/package.json' | xargs -n1 dirname | sort -u)
          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$dirs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIRS: ${{ steps.changed.outputs.dirs }}
        run: |
          echo "$DIRS" | while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            echo "publish $name@$version"
            (cd "$dir" && npm publish --access public)
          done
